apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- if .Values.persistence.storageClassName }}
  storageClassName: {{ .Values.persistence.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: n8nmeter
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 7810
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - name: N8N_METER_SOURCE_ID
              value: {{ required "source.id is required" .Values.source.id | quote }}
            - name: N8N_METER_SOURCE_LABEL
              value: {{ .Values.source.label | quote }}
            - name: N8N_VERSION
              value: {{ .Values.source.n8nVersion | quote }}
            - name: N8N_METER_INTERVAL_SECONDS
              value: {{ .Values.source.intervalSeconds | quote }}
            - name: PGHOST
              value: {{ required "database.host is required" .Values.database.host | quote }}
            - name: PGPORT
              value: {{ .Values.database.port | quote }}
            - name: PGDATABASE
              value: {{ .Values.database.name | quote }}
            - name: PGUSER
              value: {{ .Values.database.user | quote }}
            - name: PGSCHEMA
              value: {{ .Values.database.schema | quote }}
            - name: N8N_TABLE_PREFIX
              value: {{ .Values.database.tablePrefix | quote }}
            - name: PGPASSWORD_FILE
              value: /run/secrets/db/password
            - name: N8N_METER_N8N_UPSTREAM
              value: {{ required "gateway.n8nUpstream is required" .Values.gateway.n8nUpstream | quote }}
            {{- if .Values.database.caSecret }}
            - name: PGSSLROOTCERT
              value: /run/secrets/ca/ca.crt
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: db
              mountPath: /run/secrets/db
              readOnly: true
            {{- if .Values.database.caSecret }}
            - name: ca
              mountPath: /run/secrets/ca
              readOnly: true
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
        - name: gateway
          image: "{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag }}"
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          ports:
            - name: gateway
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: N8N_UPSTREAM
              value: {{ required "gateway.n8nUpstream is required" .Values.gateway.n8nUpstream | quote }}
            - name: N8N_METER_UPSTREAM
              value: http://127.0.0.1:7810
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
          readinessProbe:
            httpGet:
              path: /__n8nmeter/healthz
              port: gateway
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
      volumes:
        - name: nginx-conf
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-data
        - name: db
          secret:
            secretName: {{ required "database.existingSecret is required" .Values.database.existingSecret }}
            items:
              - key: {{ .Values.database.passwordKey }}
                path: password
        {{- if .Values.database.caSecret }}
        - name: ca
          secret:
            secretName: {{ .Values.database.caSecret }}
            items:
              - key: {{ .Values.database.caKey }}
                path: ca.crt
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: gateway
      port: 8080
      targetPort: gateway
